openapi: 3.1.1
info:
  title: Distributed Task Platform Lab API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /v1/health/live:
    get:
      operationId: getHealthLive
      responses:
        "200":
          description: Live status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/health/ready:
    get:
      operationId: getHealthReady
      responses:
        "200":
          description: Ready status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /v1/metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/projects/{projectId}:
    get:
      operationId: getProjectById
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/projects/{projectId}/summary:
    get:
      operationId: getProjectSummary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Cached project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/projects/{projectId}/tasks:
    get:
      operationId: listProjectTasks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    post:
      operationId: createProjectTask
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/projects/{projectId}/tasks/import:
    post:
      operationId: importProjectTasks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/jobs/{jobId}:
    get:
      operationId: getJobStatus
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/jobs/{jobId}/events:
    get:
      operationId: getJobEvents
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Safe job events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobEvent"
  /v1/jobs/{jobId}/retry:
    post:
      operationId: retryJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Job retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/architecture/service-boundary:
    get:
      operationId: getServiceBoundary
      responses:
        "200":
          description: Service boundary notes
  /v1/architecture/migration-plan:
    get:
      operationId: getMigrationPlan
      responses:
        "200":
          description: Migration plan
  /v1/cache-demo/projects/{projectId}/summary:
    get:
      operationId: getCacheDemoProjectSummary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Cache demo summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
  /v1/cache-demo/projects/{projectId}/invalidate:
    post:
      operationId: invalidateCacheDemoProjectSummary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Cache invalidation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  invalidated:
                    type: boolean
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
  responses:
    ProblemResponse:
      description: Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        dependencies:
          type: object
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    JobStatus:
      type: object
      properties:
        jobId:
          type: string
        jobName:
          type: string
        payloadVersion:
          type: string
        status:
          type: string
        attemptCount:
          type: integer
        failureClass:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
    JobEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectSummary:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        cacheStatus:
          type: string
          enum: [hit, miss]
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
