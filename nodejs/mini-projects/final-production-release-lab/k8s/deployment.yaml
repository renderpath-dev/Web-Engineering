apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-production-release-lab-api
  namespace: final-production-release-lab
  labels:
    app: final-production-release-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-production-release-lab
  template:
    metadata:
      labels:
        app: final-production-release-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: final-production-release-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3050
          envFrom:
            - configMapRef:
                name: final-production-release-lab-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
