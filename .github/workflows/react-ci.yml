name: React workspace CI

on:
  push:
    branches:
      - main
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"

permissions:
  contents: read

jobs:
  verify-react:
    name: Verify React workspace
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
